<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players | Sunday Romania</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <aside>
    <div class="brand">
      <img src="SundayRomania.png" alt="Sunday Romania" class="brand-logo">
      <div class="brand-text">
        <span>SUNDAY</span>
        <strong>ROMANIA</strong>
      </div>
    </div>

    <p>GENERAL</p>
    <a href="index.html">Dashboard</a>
    <a href="regulament.html">Regulament</a>
    <a href="magazin.html">Magazin</a>
    <a href="sugestii.html">Sugestii</a>
    <a href="players.html" class="active">Players</a>
    <a href="staff.html">Staff Members</a>
    <a href="banati.html">Jucători Banați</a>
    <a href="harta.html">Hartă</a>

    <p>FACȚIUNI</p>
    <a href="factiuni.html">Facțiuni</a>
  </aside>

  <main>
    <header>
      <h2>Players</h2>
      <a class="discord-btn" href="index.html">Dashboard</a>
    </header>

    <section class="news">
      <div class="img">
        PLAYERS
      </div>

      <div class="text">
        <b>LIVE</b>
        <h2>Jucători Online</h2>
        <p>Lista jucătorilor conectați pe server.</p>
      </div>
    </section>

    <section class="players-box">
      <div class="players-title">
        <h2>Jucători Online</h2>

        <input
          type="text"
          id="playerSearch"
          class="players-search"
          placeholder="🔍 Caută jucător..."
        >
      </div>

      <div class="players-table">
        <div class="players-header">
          <div>ID</div>
          <div>JUCĂTOR</div>
          <div>FACȚIUNE</div>
          <div>ORE</div>
          <div>PING</div>
        </div>

        <div id="playersContainer">
          <div class="empty-state">
            <h3>Se încarcă jucătorii...</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="api.js"></script>
</body>
</html>
